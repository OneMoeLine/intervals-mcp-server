# Cloudflare Workers deployment of the hosted, multi-user server. See
# "Hosting it for others" in README.md. The stdio server does not use this.
name = "intervals-mcp"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# OAuth clients, grants and tokens. Tokens are stored only as hashes and each
# grant's props (the user's API key) are encrypted. Create the namespace with
# `npx wrangler kv namespace create OAUTH_KV` and paste its id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c5bfc307dae84bb69fd3a8a5cfabe442"

# Secrets, set with `npx wrangler secret put <NAME>` (or .dev.vars locally):
#   INVITE_CODE  the one code everyone enters to sign in

[observability]
enabled = true
